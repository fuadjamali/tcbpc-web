services:
  postgres:
    image: postgres:17-alpine
    container_name: tcbpc-web-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tcbpc
      POSTGRES_PASSWORD: tcbpc
      POSTGRES_DB: tcbpc_web
    ports:
      - "5436:5432"
    volumes:
      - tcbpc-web-db-data:/var/lib/postgresql/data

volumes:
  tcbpc-web-db-data:
